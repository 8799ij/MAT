<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار سرعة الرد</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 1rem; color: #38bdf8; }
        p { margin-bottom: 1.5rem; color: #94a3b8; }
        .box {
            height: 150px;
            border-radius: 8px;
            background-color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
            margin-bottom: 1.5rem;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .result { margin-top: 1rem; font-size: 1.1rem; color: #4ade80; }
    </style>
</head>
<body>

<div class="container">
    <h1>اختبار رد الفعل ⚡</h1>
    <p>اضغط على المربع فور تحوله إلى اللون الأخضر!</p>
    
    <div id="target" class="box">اضغط "ابدأ" للبدء</div>
    
    <button id="startBtn" onclick="startGame()">ابدأ الاختبار</button>
    <div id="result" class="result"></div>
</div>

<script>
    let startTime;
    let timeoutId;
    const box = document.getElementById('target');
    const result = document.getElementById('result');
    const startBtn = document.getElementById('startBtn');

    function startGame() {
        result.textContent = '';
        box.style.backgroundColor = '#ef4444'; // أحمر
        box.textContent = 'انتظر اللون الأخضر...';
        startBtn.disabled = true;

        const randomDelay = Math.floor(Math.random() * 3000) + 2000; // بين 2 و 5 ثوانٍ

        timeoutId = setTimeout(() => {
            box.style.backgroundColor = '#22c55e'; // أخضر
            box.textContent = 'اضغط الآن!';
            startTime = Date.now();
        }, randomDelay);
    }

    box.addEventListener('click', () => {
        if (box.style.backgroundColor === 'rgb(34, 197, 94)') { // أخضر
            const reactionTime = Date.now() - startTime;
            result.textContent = `سرعة رد فعلك: ${reactionTime} ملي ثانية! 🔥`;
            resetBox();
        } else if (box.style.backgroundColor === 'rgb(239, 68, 68)') { // أحمر
            clearTimeout(timeoutId);
            result.textContent = 'تسرّعت! اضغط قبل أن يتحول للأخضر. ❌';
            resetBox();
        }
    });

    function resetBox() {
        box.style.backgroundColor = '#334155';
        box.textContent = 'اضغط "ابدأ" للبدء';
        startBtn.disabled = false;
    }
</script>

</body>
</html>
